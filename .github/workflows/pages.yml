# Bouwt ThuisaccuMatch en publiceert via GitHub Pages (bron: GitHub Actions).
# LIVE sinds 19-10-2026 (akkoord gegeven): BASE leeg, GO_LIVE=1 (CNAME thuisaccumatch.nl, indexeerbaar). Testversie was BASE=/thuisaccumatch-site.
name: Deploy ThuisaccuMatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  BASE: ''
  GO_LIVE: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
