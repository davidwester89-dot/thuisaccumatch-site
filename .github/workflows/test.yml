# Tests en build bij elke push (zonder publiceren).
name: Test ThuisaccuMatch
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # L7: basis = github.event.before moet in de clone zitten
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        env:
          # PR (ook Dependabot): basis = base-commit van de PR; push: wat live stond. Ontbreekt die basis in de clone, dan faalt L7 (zo bedoeld).
          L7_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run build
        env:
          BASE: /thuisaccumatch-site
