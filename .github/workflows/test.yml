# Tests en build bij elke push (zonder publiceren).
name: Test ThuisaccuMatch
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # L7: basis = github.event.before moet in de clone zitten
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        env:
          L7_BASE: ${{ github.event.before }} # L7 vergelijkt met wat live stond, niet HEAD met zichzelf
      - run: npm run build
        env:
          BASE: /thuisaccumatch-site
